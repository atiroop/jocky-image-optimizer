name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, xml, zip
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --no-check-publish
      - run: composer audit --locked
      - name: WordPress Coding Standards
        run: composer lint
      - name: PHP syntax check
        run: find . -path './.git' -prune -o -path './vendor' -prune -o -path './build' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Standalone tests
        run: composer test
  wordpress-integration:
    runs-on: ubuntu-24.04
    needs: static-and-unit
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.6.11', '7.1.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_VERSION: ${{ matrix.wordpress }}
      WP_INSTALL_TESTS_SKIP_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, mysqli, xml, zip
          tools: composer:v2
      - name: Install WebP encoder for packaged media integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y webp
      - run: composer install --no-interaction --prefer-dist
      - name: Build and verify production ZIP
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php scripts/package.php
          composer test:package
          unzip -t build/jocky-image-optimizer-0.4.0-beta.zip
          composer install --no-interaction --prefer-dist
      - name: Install isolated WordPress test runtime
        env:
          TMPDIR: ${{ runner.temp }}/jio-wp-tests
          WP_CORE_DIR: ${{ runner.temp }}/jio-wp-tests/wordpress
          WP_TESTS_DIR: ${{ runner.temp }}/jio-wp-tests/wordpress-tests-lib
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 "$WP_VERSION" true
          mkdir -p "$WP_CORE_DIR/wp-content/plugins"
          unzip -q build/jocky-image-optimizer-0.4.0-beta.zip -d "$WP_CORE_DIR/wp-content/plugins"
      - name: Run WordPress integration tests against packaged plugin
        env:
          TMPDIR: ${{ runner.temp }}/jio-wp-tests
          WP_CORE_DIR: ${{ runner.temp }}/jio-wp-tests/wordpress
          WP_TESTS_DIR: ${{ runner.temp }}/jio-wp-tests/wordpress-tests-lib
          JIO_PACKAGE_PATH: ${{ github.workspace }}/build/jocky-image-optimizer-0.4.0-beta.zip
        run: |
          vendor/bin/phpunit --configuration phpunit.xml.dist --filter '/test_schema_seed_recovery|test_schema_version_mismatch|test_individual_attachment|test_automatic_queueing|test_bulk_scan|test_unsupported_and_missing/'
          composer test:integration
      - name: Exercise recovery commands through pinned WP-CLI
        env:
          WP_CORE_DIR: ${{ runner.temp }}/jio-wp-tests/wordpress
          WP_CLI_PHAR: ${{ runner.temp }}/wp-cli-2.12.0.phar
          JIO_WPCLI_DB_NAME: wordpress_test
          JIO_WPCLI_DB_USER: root
          JIO_WPCLI_DB_PASSWORD: root
          JIO_WPCLI_DB_HOST: 127.0.0.1
        run: |
          set -euo pipefail
          checksum_file="$RUNNER_TEMP/wp-cli-2.12.0.phar.sha512"
          curl --fail --silent --show-error --location --output "$WP_CLI_PHAR" "https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar"
          curl --fail --silent --show-error --location --output "$checksum_file" "https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar.sha512"
          printf '%s  %s\n' "$(cat "$checksum_file")" "$WP_CLI_PHAR" | sha512sum --check --status
          bash bin/test-wp-cli.sh
  encoder-integration:
    runs-on: ubuntu-24.04
    needs: static-and-unit
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, mysqli, xml, zip
          tools: composer:v2
      - name: Install trusted Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake libpng-dev nasm pkg-config rustc cargo webp=1.3.2-0.4build3 libavif-bin=1.0.4-1ubuntu3
      - name: Build pinned MozJPEG source
        run: |
          set -euo pipefail
          git clone https://github.com/mozilla/mozjpeg.git "$RUNNER_TEMP/mozjpeg-src"
          git -C "$RUNNER_TEMP/mozjpeg-src" checkout 38f37cf900958c1004c2eea945a773764ba20716
          cmake -S "$RUNNER_TEMP/mozjpeg-src" -B "$RUNNER_TEMP/mozjpeg-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/mozjpeg-install" -DENABLE_SHARED=FALSE
          cmake --build "$RUNNER_TEMP/mozjpeg-build" --parallel 2
          cmake --install "$RUNNER_TEMP/mozjpeg-build"
          echo "$RUNNER_TEMP/mozjpeg-install/bin" >> "$GITHUB_PATH"
      - name: Install pngquant and pinned oxipng
        run: |
          set -euo pipefail
          sudo apt-get install --no-install-recommends -y pngquant
          cargo install oxipng --version 9.1.2 --locked --jobs 2 --root "$RUNNER_TEMP/oxipng"
          echo "$RUNNER_TEMP/oxipng/bin" >> "$GITHUB_PATH"
      - name: Install PHP development dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Verify installed encoders and run real fixture integration tests
        run: |
          cjpeg -version
          djpeg -version
          jpegtran -version
          pngquant --version
          oxipng --version
          cwebp -version
          avifenc --version
          dwebp -version
          avifdec --version
          composer test:encoders

  beta-package-artifact:
    runs-on: ubuntu-24.04
    needs: [static-and-unit, encoder-integration, wordpress-integration]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer:v2
      - name: Build and validate beta plugin ZIP
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php scripts/package.php
          composer test:package
          unzip -t build/jocky-image-optimizer-0.4.0-beta.zip
          test -s build/jocky-image-optimizer-0.4.0-beta.zip
          sha256sum build/jocky-image-optimizer-0.4.0-beta.zip
      - name: Publish installable plugin ZIP as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jocky-image-optimizer-0.4.0-beta
          path: build/jocky-image-optimizer-0.4.0-beta.zip
          if-no-files-found: error
          retention-days: 30
